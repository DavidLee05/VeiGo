        SERVICE_DLL: VeiGo.Gateway.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__user__Destinations__default__Address: http://user-service:8080/
      ReverseProxy__Clusters__catalog__Destinations__default__Address: http://catalog-service:8080/
      ReverseProxy__Clusters__search__Destinations__default__Address: http://search-service:8080/
      ReverseProxy__Clusters__booking__Destinations__default__Address: http://booking-service:8080/
      ReverseProxy__Clusters__payment__Destinations__default__Address: http://payment-service:8080/
      ReverseProxy__Clusters__dealer__Destinations__default__Address: http://dealer-service:8080/
      ReverseProxy__Clusters__inventory__Destinations__default__Address: http://inventory-service:8080/
      ReverseProxy__Clusters__rental__Destinations__default__Address: http://rental-service:8080/
      ReverseProxy__Clusters__notification__Destinations__default__Address: http://notification-service:8080/
    depends_on:
      - user-service
      - catalog-service
      - search-service
      - booking-service
      - payment-service
      - dealer-service
      - inventory-service
      - rental-service
      - notification-service
    ports:
      - "127.0.0.1:5100:8080"

volumes:
  veigo-postgres-data:
