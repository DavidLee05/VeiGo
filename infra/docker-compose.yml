    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Database=veigo;Username=veigo_catalog;Password=${CATALOG_DB_PASSWORD};Search Path=catalog
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5202:8080"

  search-service:
