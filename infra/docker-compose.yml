services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: veigo
      POSTGRES_USER: veigo_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - veigo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veigo_admin -d veigo"]
      interval: 5s
      timeout: 5s
      retries: 12

  user-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: services/VeiGo.UserService/VeiGo.UserService.csproj
        SERVICE_DLL: VeiGo.UserService.dll
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Database=veigo;Username=veigo_user;Password=${USER_DB_PASSWORD};Search Path=user
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5201:8080"

  catalog-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE_PROJECT: services/VeiGo.CatalogService/VeiGo.CatalogService.csproj
